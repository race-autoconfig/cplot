# Book settings
title: craceplot
authors: Yunshuang Xiao

# Execution settings
execute:
  execute_notebooks: "auto"

# HTML settings
html:
  use_repository_button: true
  use_issues_button: true
  home_page_in_navbar: true

# Repository information
repository:
  url: https://github.com/auto-configurator/craceplot
  path_to_book: .
  branch: main

sphinx:
  config:
    project: "craceplot"

    include_patterns:
      - "**"
      - "../README.md"

    html_extra_path:
      - '../craceplot/_vignettes/guide.ipynb'
      - '../craceplot/_inst/examples'

    html_context:
      github_user: auto-configurator
      github_repo: craceplot
      github_version: main
      doc_path: docs
      # metatags: |
      #   <meta name="google-site-verification" content="JOXRioKAur8pUUQhyzmuJqKs79IpGF4JPq09mDUt7W8" />

    html_show_sourcelink: false

    html_theme: piccolo_theme

    html_static_path: ['_static']
    html_css_files: [
        'css/custom.css',
    ]
    html_js_files: [
        'js/navbar.js',
    ]
